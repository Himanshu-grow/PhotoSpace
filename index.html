<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0c0d">
    <title>Explore | PhotoSpace</title>
    <link rel="icon" type="image/png" href="pictures/camera-logo-edited.png">
    <link rel="stylesheet" href="css/main-css.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/explore.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img src="pictures/full-logo.png" alt="PhotoSpace"></a>
        <nav class="nav-links" aria-label="Main navigation"><a href="index.html" aria-current="page">Explore</a></nav>
        <div class="nav-actions" id="nav-actions"></div>
    </header>
    <main class="explore-wrap">
        <section class="explore-hero">
            <p class="explore-kicker">A COMMUNITY OF IMAGE MAKERS</p>
            <h1>Find a new<br><span>point of view.</span></h1>
            <p>Explore photographers, discover their collections, and make a home for your own photos.</p>
            <a class="explore-cta" href="auth.html">Create your profile <span aria-hidden="true">↗</span></a>
        </section>
        <section class="discover-section" aria-labelledby="discover-heading">
            <div class="discover-heading-row">
                <div><p class="explore-kicker">THE COMMUNITY</p><h2 id="discover-heading">Discover people</h2></div>
                <label class="profile-search"><span class="visually-hidden">Search profiles</span><input id="profile-search" type="search" placeholder="Search by name or username"></label>
            </div>
            <div id="profile-list" class="profile-list" aria-live="polite"><p class="empty-message">Loading profiles…</p></div>
        </section>
        <section class="discover-section recent-section" aria-labelledby="recent-heading">
            <div class="discover-heading-row"><div><p class="explore-kicker">FRESH FROM THE COMMUNITY</p><h2 id="recent-heading">Recent photographs</h2></div></div>
            <div id="recent-photos" class="recent-photos" aria-live="polite"><p class="empty-message">Loading photos…</p></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="scripts/explore.js"></script>
</body>
</html>
