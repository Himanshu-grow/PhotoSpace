<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password | PhotoSpace</title>
    <link rel="stylesheet" href="css/main-css.css"><link rel="stylesheet" href="css/auth.css">
</head><body class="auth-page">
    <header class="navbar"><a href="index.html" class="logo"><img src="pictures/full-logo.png" alt="PhotoSpace"></a><nav class="nav-links"><a href="index.html">Explore</a></nav></header>
    <main class="auth-wrap"><section class="auth-card">
        <p class="explore-kicker">ACCOUNT RECOVERY</p><h1>Choose a new password</h1>
        <form id="password-update-form" class="auth-form">
            <label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
            <label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
            <button class="auth-submit" type="submit">Update password</button>
        </form>
        <p id="password-update-message" class="auth-message" role="status"></p>
    </section></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="scripts/passwordReset.js"></script>
</body></html>
