<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | PhotoSpace</title>
    <link rel="stylesheet" href="css/main-css.css"><link rel="stylesheet" href="css/auth.css">
</head><body class="auth-page">
    <header class="navbar"><a href="index.html" class="logo"><img src="pictures/full-logo.png" alt="PhotoSpace"></a><nav class="nav-links"><a href="index.html">Explore</a></nav></header>
    <main class="auth-wrap"><section class="auth-card">
        <p class="explore-kicker">ACCOUNT RECOVERY</p><h1>Reset your password</h1>
        <p class="auth-intro">We’ll email you a secure link to choose a new password.</p>
        <form id="reset-request-form" class="auth-form">
            <label for="reset-email">Email</label><input id="reset-email" type="email" autocomplete="email" required>
            <button class="auth-submit" type="submit">Send reset link</button>
        </form>
        <p id="reset-message" class="auth-message" role="status"></p><a class="forgot-link" href="auth.html">Back to sign in</a>
    </section></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="scripts/passwordReset.js"></script>
</body></html>
